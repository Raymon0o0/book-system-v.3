<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить книгу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/images/library.jpg'); /* тот же фон */
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .form-wrapper {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-plus-circle"></i> Добавить книгу
            </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/add">Добавить книгу</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/database">Управление БД</a> <!-- ИЗМЕНЕНО -->
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/h2-console" target="_blank">H2 Console</a> <!-- НОВОЕ -->
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-wrapper">
        <h2 class="mb-4"><i class="bi bi-book"></i> Добавление новой книги</h2>

        <form th:action="@{/save}" th:object="${book}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Название книги *</label>
                    <input type="text" class="form-control" th:field="*{title}" required
                           placeholder="Введите название книги">
                    <div class="form-text">Обязательное поле</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Автор *</label>
                    <input type="text" class="form-control" th:field="*{author}" required
                           placeholder="Введите автора">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Жанр *</label>
                    <select class="form-select" th:field="*{genre}" required>
                        <option value="">Выберите жанр...</option>
                        <option value="Роман">Роман</option>
                        <option value="Детектив">Детектив</option>
                        <option value="Фантастика">Фантастика</option>
                        <option value="Фэнтези">Фэнтези</option>
                        <option value="Научная литература">Научная литература</option>
                        <option value="Поэзия">Поэзия</option>
                        <option value="Драма">Драма</option>
                        <option value="Комедия">Комедия</option>
                        <option value="Исторический">Исторический</option>
                        <option value="Биография">Биография</option>
                        <option value="Учебная литература">Учебная литература</option>
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Год издания</label>
                    <input type="number" class="form-control" th:field="*{publicationYear}"
                           placeholder="Например: 2023">
                    <div class="form-text">1000-2026</div>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Копии *</label>
                    <input type="number" class="form-control" th:field="*{copies}"
                           min="1" value="1" required>
                    <div class="form-text">Минимум 1</div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Сохранить книгу
                </button>
                <a href="/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
