<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Библиотека - Книжный фонд</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background-image: url('/images/library.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            background-color: rgba(255, 255, 255, 0.97);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
        }

        .table {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .table th {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
        }

        .table td {
            padding: 12px;
            vertical-align: middle;
        }

        .search-form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-book me-2"></i> Библиотечная система
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/">Главная</a>
            <a class="nav-link" href="/add">Добавить книгу</a>
            <a class="nav-link" href="/stats">Статистика</a>
            <a class="nav-link" href="/database">Управление БД</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="main-container">
        <h1 class="mb-4">📚 Книжный фонд библиотеки</h1>

        <!-- Поиск -->
        <div class="search-form">
            <form action="/search" method="get" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="title" class="form-control"
                           th:value="${searchTitle != null ? searchTitle : ''}"
                           placeholder="Название книги...">
                </div>
                <div class="col-md-3">
                    <input type="text" name="author" class="form-control"
                           th:value="${searchAuthor != null ? searchAuthor : ''}"
                           placeholder="Автор...">
                </div>
                <div class="col-md-2">
                    <select name="genre" class="form-select">
                        <option value="">Все жанры</option>
                        <option th:each="genre : ${allGenres}"
                                th:value="${genre}"
                                th:selected="${searchGenre == genre}"
                                th:text="${genre}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="year" class="form-select">
                        <option value="">Все годы</option>
                        <option th:each="year : ${allYears}"
                                th:value="${year}"
                                th:selected="${searchYear == year}"
                                th:text="${year}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> Найти
                    </button>
                </div>
            </form>
            <div class="mt-3">
                <a href="/" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-clockwise"></i> Сбросить поиск
                </a>
            </div>
        </div>

        <!-- Таблица -->
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Автор</th>
                    <th>Жанр</th>
                    <th>Год</th>
                    <th>Копии</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}">1</td>
                    <td>
                        <a th:href="@{/book/{id}(id=${book.id})}" class="text-decoration-none">
                            <span class="fw-semibold text-primary" th:text="${book.title}">Война и мир</span>
                        </a>
                    </td>
                    <td th:text="${book.author}">Лев Толстой</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${book.genre}">Роман</span>
                    </td>
                    <td th:text="${book.publicationYear}">1869</td>
                    <td>
                        <span class="badge bg-success" th:text="${book.copies} + ' шт.'">5 шт.</span>
                    </td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-warning">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/delete/{id}(id=${book.id})}"
                               class="btn btn-danger"
                               onclick="return confirm('Удалить книгу \'' + [[${book.title}]] + '\'?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Статистика -->
        <div class="mt-4">
            <div class="row">
                <div class="col-md-6">
                    <p class="text-muted">
                        <i class="bi bi-book"></i> Книг в каталоге:
                        <span class="badge bg-primary" th:text="${books != null ? books.size() : 0}">0</span>
                    </p>
                </div>
                <div class="col-md-6 text-end">
                    <a href="/stats" class="btn btn-info">Статистика</a>
                    <a href="/add" class="btn btn-success ms-2">Добавить книгу</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
