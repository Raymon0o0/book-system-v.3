<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать книгу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background-image: url('/images/library.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .form-wrapper {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-warning">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-pencil-square"></i> Редактировать книгу
        </span>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/">На главную</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-wrapper">
        <h2 class="mb-4"><i class="bi bi-book"></i> Редактирование книги</h2>

        <form th:action="@{/update/{id}(id=${book.id})}" th:object="${book}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Название книги *</label>
                    <input type="text" class="form-control" th:field="*{title}" required
                           placeholder="Введите название книги">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Автор *</label>
                    <input type="text" class="form-control" th:field="*{author}" required
                           placeholder="Введите автора">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Жанр *</label>
                    <select class="form-select" th:field="*{genre}" required>
                        <option value="">Выберите жанр...</option>
                        <option th:each="g : ${genres}"
                                th:value="${g}"
                                th:text="${g}"
                                th:selected="${g == book.genre}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Год издания</label>
                    <input type="number" class="form-control" th:field="*{publicationYear}"
                           min="1000" max="2026" placeholder="Например: 2023">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Копии *</label>
                    <input type="number" class="form-control" th:field="*{copies}"
                           min="1" required>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-check-circle"></i> Сохранить изменения
                </button>
                <a href="/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
